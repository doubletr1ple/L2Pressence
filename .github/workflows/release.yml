name: Publish GitHub Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify tag matches project version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          [xml]$project = Get-Content L2Presence.csproj
          $projectVersion = $project.Project.PropertyGroup.Version
          if ($tagVersion -ne $projectVersion) {
            throw "Tag version $tagVersion does not match project version $projectVersion."
          }

      - name: Publish Windows x64 executable
        run: dotnet publish L2Presence.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist

      - name: Package release assets
        shell: pwsh
        run: |
          Compress-Archive -LiteralPath dist/L2Presence.exe -DestinationPath dist/L2Presence-win-x64.zip
          $hash = (Get-FileHash dist/L2Presence.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  L2Presence.exe" | Set-Content dist/L2Presence.exe.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: L2Presence-${{ github.ref_name }}-win-x64
          path: |
            dist/L2Presence.exe
            dist/L2Presence-win-x64.zip
            dist/L2Presence.exe.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/L2Presence.exe#Standalone Windows x64 executable" `
            "dist/L2Presence-win-x64.zip#Windows x64 ZIP archive" `
            "dist/L2Presence.exe.sha256#SHA-256 checksum" `
            --verify-tag `
            --latest `
            --title "L2Presence ${{ github.ref_name }}" `
            --notes-file RELEASE_NOTES.md
